name: Validate and package V1.9 Windows
on:
  push:
    branches: [codex/ag-motion-studio-v1.9]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test, benchmark, freeze and smoke-test Windows
        run: python packaging/build_release.py --output release
      - name: Upload Windows package and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AG-Astro-Motion-Studio-V1.9-Windows-x64
          path: |
            release/*.zip
            release/ARCHIVE_SHA256.txt
            release/validation/**
            release/*/PACKAGED_SELF_TEST.json
            release/*/BUILD_INFO.json
          if-no-files-found: warn
